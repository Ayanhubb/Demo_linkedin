[project]
name = "linkedin-scheduler"
version = "0.1.0"
description = "LinkedIn post scheduler"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "celery>=5.4",
    "cryptography>=44.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "redis>=5.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: logic that does not need PostgreSQL",
    "api: HTTP API",
    "database: PostgreSQL behavior",
    "linkedin: LinkedIn HTTP mocked with httpx",
    "celery: due-post worker and beat",
]
